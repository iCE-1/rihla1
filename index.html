<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرحلة العلمية — سجل الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EDE4D0;
    --paper-dark:#E2D6BC;
    --ink:#2A2620;
    --ink-soft:#5B5346;
    --green:#33503B;
    --green-deep:#22362A;
    --gold:#AD8737;
    --red:#8C4A3C;
    --rule: rgba(42,38,32,0.15);
  }
  body.dark-mode{
    --paper:#1E1B16;
    --paper-dark:#2A251E;
    --ink:#EDE4D0;
    --ink-soft:#B8AD98;
    --green:#5C8A6B;
    --green-deep:#8FBF9E;
    --gold:#D4AF5A;
    --red:#C97B67;
    --rule: rgba(237,228,208,0.15);
  }
  body.void-mode{
    color-scheme:dark;
    --paper:#0a0a0a;
    --paper-dark:#151515;
    --ink:#f0f0f0;
    --ink-soft:#9b9b9b;
    --green:#9e9e9e;
    --green-deep:#e8e8e8;
    --gold:#D4AF5A;
    --red:#d9826e;
    --rule: rgba(255,255,255,0.12);
  }
  body.void-mode{background:radial-gradient(ellipse at top,#171717,#0a0a0a 65%);}
  body.void-mode .pf-medal{background:linear-gradient(150deg,#ececec,#6a6a6a);color:#111;}
  body.void-mode .pf-medal b{text-shadow:none;}
  body.void-mode .monthly-summary-toggle:hover{background:rgba(255,255,255,.05);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(173,135,55,0.06), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:26px;
  }
  header.top .title{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--green-deep);
  }
  header.top .hijri-note{
    font-size:.8rem;color:var(--ink-soft);
  }
  #status-pill{
    font-size:.72rem;padding:3px 10px;border-radius:20px;
    background:var(--paper-dark);border:1px solid var(--rule);
    color:var(--ink-soft);
  }

  .stats-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
    background:var(--ink);
    border:1px solid var(--ink);
    margin-bottom:28px;
  }
  .stat{
    background:var(--paper);
    padding:14px 10px;text-align:center;
  }
  .stat .num{font-family:'Aref Ruqaa',serif;font-size:1.7rem;color:var(--green-deep);display:block;}
  .stat .lbl{font-size:.72rem;color:var(--ink-soft);}

  .entry-box{
    background:var(--paper-dark);
    border:1px solid var(--rule);
    padding:20px;margin-bottom:30px;
    position:relative;
  }
  .entry-box::before{
    content:"سجل اليوم";
    position:absolute;top:-12px;right:16px;
    background:var(--green-deep);color:var(--paper);
    font-family:'Aref Ruqaa',serif;font-size:.95rem;
    padding:3px 14px;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:5px;}
  .field textarea, .field input, .field select{
    width:100%;padding:9px 10px;
    border:1px solid var(--rule);background:var(--paper);
    font-family:'Tajawal',sans-serif;font-size:.9rem;color:var(--ink);
    border-radius:2px;
  }
  .field textarea{min-height:60px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}.stats-row{grid-template-columns:repeat(2,1fr);}}

  .tag-choices{display:flex;gap:8px;flex-wrap:wrap;}
  .tag-choices button{
    padding:6px 14px;border-radius:20px;border:1px solid var(--ink-soft);
    background:transparent;font-family:'Tajawal',sans-serif;font-size:.8rem;
    cursor:pointer;color:var(--ink-soft);transition:.15s;
  }
  .tag-choices button.active{background:var(--green);color:var(--paper);border-color:var(--green);}

  button.primary{
    background:var(--green-deep);color:var(--paper);border:none;
    padding:10px 26px;font-family:'Tajawal',sans-serif;font-weight:700;
    font-size:.9rem;cursor:pointer;border-radius:2px;
  }
  button.primary:hover{background:var(--green);}
  button.ghost{
    background:none;border:1px solid var(--rule);color:var(--ink-soft);
    padding:5px 12px;font-size:.78rem;cursor:pointer;border-radius:2px;
  }
  button.ghost:hover{border-color:var(--red);color:var(--red);}

  .timeline-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  }
  .timeline-head h2{font-family:'Aref Ruqaa',serif;font-size:1.3rem;color:var(--green-deep);margin:0;}
  .day-entry{
    border-right:3px solid var(--green);
    padding:12px 16px;margin-bottom:14px;background:var(--paper-dark);
    position:relative;
  }
  .day-entry .date{font-size:.75rem;color:var(--ink-soft);margin-bottom:6px;}
  .day-entry .tag{
    display:inline-block;font-size:.68rem;padding:2px 9px;border-radius:10px;
    background:var(--green-deep);color:var(--paper);margin-inline-start:6px;
  }
  .day-entry p{margin:4px 0;font-size:.88rem;line-height:1.7;}
  .day-entry .del{position:absolute;left:10px;top:10px;}
  .day-entry .edit{position:absolute;left:10px;top:43px;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
    border:1px dashed var(--rule);font-size:.9rem;
  }

  .setup-screen{
    max-width:560px;margin:60px auto;padding:30px;background:var(--paper-dark);
    border:1px solid var(--rule);
  }
  .setup-screen h1{font-family:'Aref Ruqaa',serif;color:var(--green-deep);}
  .setup-screen ol{font-size:.88rem;line-height:2;color:var(--ink-soft);}
  .setup-screen input{width:100%;padding:9px;margin-bottom:10px;border:1px solid var(--rule);background:var(--paper);}
  .setup-screen a{color:var(--gold);}

  .tabs-nav{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--rule);}
  .tab-btn{
    background:none;border:none;padding:9px 18px;font-family:'Tajawal',sans-serif;
    font-size:.88rem;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--green-deep);border-bottom-color:var(--green-deep);font-weight:700;}

  .subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:10px;}
  .books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}

  .path-card{
    background:var(--paper-dark);border:1px solid var(--rule);padding:16px;position:relative;
    border-right:4px solid var(--green-deep);
  }
  .subjects-grid .path-card{cursor:pointer;transition:.15s;}
  .subjects-grid .path-card:hover{border-color:var(--green);}
  .path-card.status-todo{border-right-color:var(--ink-soft);}
  .path-card.status-in_progress{border-right-color:var(--gold);}
  .path-card.status-complete{border-right-color:var(--green);}
  .path-card .del{position:absolute;left:10px;top:10px;}
  .sj-name{font-family:'Aref Ruqaa',serif;font-size:1.25rem;color:var(--green-deep);margin-bottom:4px;}
  .sj-status{font-size:.75rem;color:var(--ink-soft);margin-bottom:8px;}
  .sj-current{font-size:.82rem;margin-bottom:10px;color:var(--ink);}
  .sj-progress-bar{background:var(--paper);border:1px solid var(--rule);height:8px;border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .sj-progress-fill{background:var(--green);height:100%;}
  .sj-progress-label{font-size:.75rem;color:var(--ink-soft);margin-bottom:10px;}

  .level-section{margin-bottom:26px;}
  .level-title{
    font-family:'Aref Ruqaa',serif;font-size:1.1rem;color:var(--gold);
    margin-bottom:12px;padding-bottom:6px;border-bottom:1px dashed var(--rule);
  }

  .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .tag-chip{
    font-size:.68rem;padding:2px 9px;border-radius:10px;
    background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);
  }
  #tagSearch{padding:5px 8px;border:1px solid var(--rule);background:var(--paper);font-size:.8rem;max-width:130px;}

  .focus-phase-label{text-align:center;font-size:.9rem;color:var(--ink-soft);margin-bottom:2px;}
  .focus-display{
    font-family:'Aref Ruqaa',serif;font-size:3.2rem;text-align:center;
    color:var(--green-deep);margin:10px 0 18px;letter-spacing:2px;
  }
  .focus-controls{display:flex;gap:10px;justify-content:center;margin-top:6px;}
  .focus-check{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;cursor:pointer;}
  .focus-check input{width:auto;}
  .focus-banner{
    margin-top:16px;padding:14px;text-align:center;
    background:var(--paper);border:1px solid var(--gold);border-radius:4px;
  }

  .monthly-summary{
    background:var(--paper-dark);border:1px solid var(--rule);border-right:4px solid var(--gold);
    padding:12px 16px;margin-bottom:20px;font-size:.88rem;line-height:1.8;
  }
  .tag-group{margin-bottom:22px;}
  .tag-group-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:9px;padding:0 4px 8px;border:0;border-bottom:1px dashed var(--rule);
    background:transparent;color:var(--ink);font-family:'Tajawal',sans-serif;cursor:pointer;text-align:right;
  }
  .tag-group-head h3{margin:0;font-family:'Aref Ruqaa',serif;font-size:1.05rem;color:var(--green-deep);}
  .tag-group-head:hover h3{color:var(--gold);}
  .tag-group-count{font-size:.72rem;color:var(--ink-soft);}
  .tag-group .day-entry{margin-bottom:8px;}
  .tag-group-chevron{color:var(--gold);font-size:1.05rem;transition:transform .2s ease;}
  .tag-group-entries{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease;}
  .tag-group-entries > div{overflow:hidden;}
  .tag-group.collapsed .tag-group-entries{grid-template-rows:0fr;}
  .tag-group.collapsed .tag-group-chevron{transform:rotate(-90deg);}
  .tag-group.collapsed .tag-group-head{margin-bottom:0;}
  .monthly-summary-card{
    background:var(--paper-dark);border:1px solid var(--rule);border-right:4px solid var(--gold);
    margin-bottom:22px;overflow:hidden;
  }
  .monthly-summary-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 16px;background:transparent;border:none;color:var(--ink);cursor:pointer;
    font-family:'Tajawal',sans-serif;text-align:right;
  }
  .monthly-summary-toggle:hover{background:rgba(173,135,55,.07);}
  .monthly-summary-title{font-family:'Aref Ruqaa',serif;font-size:1.08rem;color:var(--green-deep);}
  .monthly-summary-brief{font-size:.78rem;color:var(--ink-soft);margin-inline-start:auto;}
  .summary-chevron{font-size:1.1rem;color:var(--gold);transition:transform .25s ease;}
  .monthly-summary-content{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease;}
  .monthly-summary-content > div{overflow:hidden;padding:0 16px 14px;font-size:.88rem;line-height:1.9;}
  .monthly-summary-nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule);}
  .monthly-nav-btn{min-width:130px;}
  .monthly-nav-btn[disabled]{opacity:.45;cursor:not-allowed;}
  .monthly-summary-card.collapsed .monthly-summary-content{grid-template-rows:0fr;}
  .monthly-summary-card.collapsed .summary-chevron{transform:rotate(-90deg);}
  .monthly-summary-card.collapsed .monthly-summary-content > div{padding-top:0;padding-bottom:0;}

  /* الكتب التي أدرسها الآن (الواجهة الرئيسية) */
  .current-books{margin-bottom:26px;}
  .cb-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .cb-pct{font-family:'Aref Ruqaa',serif;font-size:1.35rem;color:var(--gold);}
  .cb-sub{font-size:.72rem;color:var(--ink-soft);margin-bottom:8px;}
  .field select{cursor:pointer;}
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:5px;}

  /* إشعارات صغيرة */
  .toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px;}
  .toast{background:var(--green-deep);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;text-align:center;}
  .toast.show{opacity:1;transform:none;}
  .toast.warn{background:var(--red);}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  .focus-target{text-align:center;font-size:.9rem;color:var(--gold);min-height:1.3em;margin:-8px 0 16px;font-weight:500;}
  .field input:disabled{opacity:.55;cursor:not-allowed;}
  .tag-group-bar{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;}
  .tag-group-bar .tag-group-head{flex:1;margin-bottom:0;}
  .tag-group.collapsed .tag-group-bar{margin-bottom:0;}
  .tabs-nav{overflow-x:auto;white-space:nowrap;}
  @media(max-width:480px){.tab-btn{padding:9px 11px;font-size:.82rem;}}
  .toast-action{margin-inline-start:12px;background:transparent;border:1px solid currentColor;color:inherit;padding:2px 12px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:.8rem;}

  .goal-card{background:var(--paper-dark);border:1px solid var(--rule);border-right:4px solid var(--gold);padding:12px 16px;margin-bottom:22px;font-size:.88rem;}
  .goal-card.goal-done{border-right-color:var(--green);}
  .goal-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

  .stat-line{font-size:.88rem;line-height:1.9;margin:14px 0 6px;}
  .bars{display:flex;align-items:stretch;gap:4px;height:170px;margin:10px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--rule);}
  .bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;}
  .bar-val{height:16px;font-size:.7rem;color:var(--ink-soft);}
  .bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .bar{width:70%;max-width:34px;min-height:2px;background:var(--green);opacity:.75;border-radius:2px 2px 0 0;}
  .bar.met{background:var(--gold);opacity:1;}
  .bars-lbl{display:flex;gap:4px;}
  .bars-lbl span{flex:1;min-width:0;text-align:center;font-size:.68rem;color:var(--ink-soft);}
  .book-stat{background:var(--paper-dark);border:1px solid var(--rule);border-right:4px solid var(--gold);padding:12px 16px;margin-bottom:12px;}
  .book-stat .forecast{font-size:.8rem;color:var(--ink-soft);margin-top:8px;line-height:1.7;}

  .backup-box{background:var(--paper-dark);border:1px solid var(--rule);padding:14px 16px;margin:26px 0 10px;}
  .backup-head{font-family:'Aref Ruqaa',serif;font-size:1.1rem;color:var(--green-deep);}
  .calendar-card,.profile-card,.achievement-card{background:var(--paper-dark);border:1px solid var(--rule);padding:16px;margin-bottom:18px;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:rtl;}
  .calendar-weekday,.calendar-day{text-align:center;font-size:.72rem;}
  .calendar-weekday{color:var(--ink-soft);padding-bottom:4px;}
  .calendar-day{min-height:42px;padding:5px 2px;border:1px solid transparent;border-radius:4px;color:var(--ink-soft);}
  .calendar-day.studied{background:var(--green);color:var(--paper);font-weight:700;cursor:default;}
  .calendar-day.today{border-color:var(--gold);}
  .calendar-day.empty-day{visibility:hidden;}
  .profile-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:18px;}
  .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--green-deep);color:var(--paper);display:grid;place-items:center;font-family:'Aref Ruqaa',serif;font-size:1.8rem;border:2px solid var(--gold);}
  .profile-name{font-family:'Aref Ruqaa',serif;font-size:1.45rem;color:var(--green-deep);}
  .profile-handle{font-size:.8rem;color:var(--ink-soft);direction:ltr;text-align:right;}
  .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
  .profile-stat{padding:10px 6px;background:var(--paper);text-align:center;font-size:.75rem;color:var(--ink-soft);}
  .profile-stat b{display:block;font-family:'Aref Ruqaa',serif;font-size:1.25rem;color:var(--green-deep);}
  .achievements-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .achievement{padding:12px;background:var(--paper);border-right:3px solid var(--rule);font-size:.82rem;}
  .achievement.unlocked{border-right-color:var(--gold);}
  .achievement small{display:block;color:var(--ink-soft);margin-top:4px;}
  .header-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--green-deep);color:var(--paper);border:2px solid var(--gold);display:grid;place-items:center;font-family:'Aref Ruqaa',serif;cursor:pointer;padding:0;overflow:hidden;}
  .collapsible-title{width:100%;background:transparent;border:0;color:var(--ink);font-family:'Aref Ruqaa',serif;font-size:1.1rem;cursor:pointer;text-align:right;display:flex;justify-content:space-between;align-items:center;}
  .collapsible-body{margin-top:12px;}.collapsed .collapsible-body{display:none;}

  /* ===== الطريق: شجرة العلوم ===== */
  .tree-hint{font-size:.8rem;color:var(--ink-soft);margin:-6px 0 12px;}
  .tree-wrap{position:relative;background:radial-gradient(ellipse at 50% 100%,#1c1c1c,#0a0a0a 70%);border:1px solid #222;border-radius:18px;padding:26px 12px 10px;overflow:hidden;}
  .tree-empty{color:#999;}
  .tr-trunk{position:absolute;left:50%;transform:translateX(-50%);top:12px;bottom:44px;width:26px;z-index:0;
    background:repeating-linear-gradient(90deg,#1b1b1b 0 3px,#2d2d2d 3px 5px,#151515 5px 9px);
    clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);}
  .tr-row{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:16px 0;direction:rtl;}
  .tr-branch{position:absolute;top:50%;width:50%;height:48px;transform:translateY(-50%);overflow:visible;pointer-events:none;z-index:0;}
  .tr-row.r .tr-branch{right:0;}
  .tr-row.l .tr-branch{left:0;transform:translateY(-50%) scaleX(-1);}
  .tr-branch path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;}
  .tr-branch .limb{stroke:#2b2b2b;stroke-width:10;}
  .tr-branch .limb2{stroke:#6c6c6c;stroke-width:3;}
  .tr-branch .twig{stroke:#4b4b4b;stroke-width:2;}
  .tr-row.open .limb2{stroke:#d0d0d0;}
  .tr-row.open .twig{stroke:#8a8a8a;}
  .tr-branch.grow path{stroke-dasharray:1;stroke-dashoffset:1;animation:trGrow .9s ease-out forwards;animation-delay:var(--d,0s);}
  @keyframes trGrow{to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion:reduce){.tr-branch.grow path{animation:none;stroke-dashoffset:0;}}
  .tr-node{position:relative;z-index:2;width:68%;background:#121212;border:1px solid #333;border-radius:14px;padding:10px 12px;text-align:right;color:#e8e8e8;cursor:pointer;font-family:inherit;transition:.15s;}
  .tr-row.r .tr-node{grid-column:1;justify-self:start;}
  .tr-row.l .tr-node{grid-column:2;justify-self:end;}
  .tr-node:hover{border-color:#777;}
  .tr-row.open .tr-node{border-color:#c4c4c4;box-shadow:0 0 18px rgba(255,255,255,.09);}
  .tr-name{display:block;font-family:'Aref Ruqaa',serif;font-size:1.08rem;line-height:1.35;}
  .tr-meta{display:block;font-size:.72rem;color:#8f8f8f;margin-top:2px;}
  .tr-bar{display:block;height:3px;background:#262626;border-radius:3px;overflow:hidden;margin-top:7px;}
  .tr-bar i{display:block;height:100%;background:linear-gradient(90deg,#777,#e0e0e0);}
  .tr-panel{grid-column:1 / -1;margin-top:12px;background:#101010;border:1px solid #2a2a2a;border-radius:14px;padding:12px;color:#ddd;position:relative;z-index:2;}

function toDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function computeStreak(dateStrings){
  const set = new Set(dateStrings);
  const vac = getVacations();
  const cursor = new Date();
  if(!set.has(toDateStr(cursor))) cursor.setDate(cursor.getDate()-1);
  let streak = 0, guard = 0;
  while(guard++ < 4000){
    const ds = toDateStr(cursor);
    if(set.has(ds)) streak++;
    else if(!vac.has(ds)) break;     // يوم الإجازة لا يكسر السلسلة ولا يُحتسب فيها
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

const THEMES = ['void','dark','light'];

function currentTheme(){
  const t = localStorage.getItem('rihla_theme_v2');
  return THEMES.includes(t) ? t : 'void';
}
function applyTheme(){
  const t = currentTheme();
  document.body.classList.toggle('dark-mode', t === 'dark');
  document.body.classList.toggle('void-mode', t === 'void');
  const btn = document.getElementById('themeToggle');
  if(btn){ btn.textContent = THEME_ICON[t]; btn.title = 'المظهر: ' + THEME_NAME[t]; }
}
function toggleTheme(){
  const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
  localStorage.setItem('rihla_theme_v2', next);
  applyTheme();
  if(typeof showToast === 'function') showToast('المظهر: ' + THEME_NAME[next]);
}

}

  </div>`;
}

function saveCreds(){
  const url = document.getElementById('urlInput').value.trim();
  const key = document.getElementById('keyInput').value.trim();
  if(!url || !key){ alert('الرجاء تعبئة الحقلين'); return; }
  localStorage.setItem(LS_KEY_URL, url);
  localStorage.setItem(LS_KEY_KEY, key);
  init();
}

async function init(){
  const {url, key} = getCreds();
  if(!url || !key){ renderSetup(); return; }
  sb = window.supabase.createClient(url, key);

  // رابط استعادة كلمة السر من البريد: يفتح شاشة تعيين كلمة جديدة
  const hashIsRecovery = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY') renderPasswordScreen('recovery');
  });

  const { data: { session } } = await sb.auth.getSession();
  if(hashIsRecovery && session){ renderPasswordScreen('recovery'); return; }
  if(!session){ renderAuth(); return; }
  await renderApp();
}

function resetRedirectUrl(){
  return location.origin + location.pathname;
}

async function sendResetEmail(){
  const email = document.getElementById('authEmail').value.trim();
  const msg = document.getElementById('authMsg');
  if(!email){ msg.style.color = 'var(--red)'; msg.textContent = 'اكتب بريدك في الخانة أعلاه أولاً'; return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: resetRedirectUrl()});
  if(error){ msg.style.color = 'var(--red)'; msg.textContent = error.message; return; }
  msg.style.color = 'var(--green)';
  msg.textContent = 'إذا كان البريد مسجّلًا فقد أُرسل إليه رابط تعيين كلمة سر جديدة. تحقق من الوارد والبريد المزعج.';
}

function renderPasswordScreen(mode){
  const app = document.getElementById('app');
  const isRecovery = mode === 'recovery';
  app.innerHTML = `
  <div class="setup-screen">
    <h1>${isRecovery ? 'تعيين كلمة سر جديدة' : 'تغيير كلمة السر'}</h1>

    <input id="newPass" type="password" placeholder="كلمة السر الجديدة (6 أحرف على الأقل)" autocomplete="new-password">
    <input id="newPass2" type="password" placeholder="أعد كتابة كلمة السر" autocomplete="new-password">
    <div id="passMsg" style="color:var(--red);font-size:.8rem;margin-bottom:8px"></div>
    <button class="primary" onclick="saveNewPassword('${mode}')" style="width:100%;margin-bottom:8px">حفظ كلمة السر</button>

  </div>`;
}

async function saveNewPassword(mode){
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  const msg = document.getElementById('passMsg');
  if(p1.length < 6){ msg.textContent = 'كلمة السر لا تقل عن 6 أحرف'; return; }
  if(p1 !== p2){ msg.textContent = 'كلمتا السر غير متطابقتين'; return; }
  const {error} = await sb.auth.updateUser({password: p1});
  if(error){ msg.textContent = error.message; return; }
  history.replaceState(null, '', location.pathname);
  await renderApp();
  showToast('تم تغيير كلمة السر ✓');
}

async function signIn(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){ document.getElementById('authMsg').textContent = error.message; return; }
  await renderApp();
}

async function signUp(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const handle = document.getElementById('authHandle').value.trim().toLowerCase().replace(/^@/, '');
  if(!email || password.length < 6 || !/^[a-z0-9_]{3,24}$/.test(handle)){
    document.getElementById('authMsg').textContent = 'أدخل بريدًا وكلمة سر، ومعرّفًا من 3 إلى 24 حرفًا إنجليزيًا أو رقمًا أو _';
    return;
  }
  const {data, error} = await sb.auth.signUp({email, password, options:{data:{pending_handle:handle}}});
  if(error){ document.getElementById('authMsg').textContent = error.message; return; }
  if(data.session){ await renderApp(); }
  else { document.getElementById('authMsg').style.color = 'var(--green)'; document.getElementById('authMsg').textContent = 'تم إنشاء الحساب. تحقق من بريدك لتفعيله ثم سجّل دخولك.'; }
}

async function signOut(){
  await sb.auth.signOut();
  renderAuth();
}

function switchTab(tab){
  if(tab==='path') currentSubjectId = null;
  const tabs = {daily:['tabDaily','dailyView'], path:['tabPath','pathView'], focus:['tabFocus','focusView'], stats:['tabStats','statsView'], profile:['tabProfile','profileView']};
  Object.entries(tabs).forEach(([k,[btn,view]])=>{
    document.getElementById(btn).classList.toggle('active', k===tab);
    document.getElementById(view).style.display = k===tab ? '' : 'none';
  });
  if(tab==='path') renderPathView();
  if(tab==='daily'){ loadEntries(); syncBooksUi(); }
  if(tab==='focus') syncBooksUi();
  if(tab==='stats') openStats();
  if(tab==='profile') openProfile();
}

/* ============ الكتب: ذاكرة مؤقتة + ربط بالسجل والتركيز ============ */

let booksCache = [];
let entriesCache = [];

async function refreshBooksCache(){
  let res = await sb.from('books').select('*, subjects(name)').order('level').order('sort_order').order('created_at');
  if(res.error) res = await sb.from('books').select('*').order('level').order('sort_order').order('created_at');
  if(!res.error) booksCache = res.data || [];
  return res.error;
}

async function syncBooksUi(){
  await refreshBooksCache();
  renderCurrentBooks();
  refreshBookSelects();
}

function lessonUnit(b){ return (b.kind || 'matn') === 'book' ? 'صفحة' : 'درس'; }

function bookOptionsHtml(selectedId){
  const rank = {in_progress:0, todo:1, complete:2};
  const list = booksCache
    .filter(b => b.status !== 'complete' || b.id === selectedId)
    .sort((a,b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9));

  if(action){

  }

/* يسجّل في الكتاب أنك وصلت للدرس/الصفحة n، كأنك عدّلته بنفسك من «الطريق» */
async function recordProgress(book, n){
  const b = booksCache.find(x => x.id === book.id) || book;
  if(!n || n <= 0) return false;
  const isPages = (b.kind || 'matn') === 'book';
  const doneKey = isPages ? 'completed_pages' : 'completed_lessons';
  const totalKey = isPages ? 'total_pages' : 'total_lessons';
  const total = b[totalKey] || 0;
  const prev = b[doneKey] || 0;
  let next = Math.max(prev, n);
  if(total > 0) next = Math.min(next, total);
  const patch = {};
  if(next !== prev) patch[doneKey] = next;
  let status = b.status;
  if(total > 0 && next >= total) status = 'complete';
  else if(status === 'todo') status = 'in_progress';
  if(status !== b.status) patch.status = status;
  if(!Object.keys(patch).length) return false;
  const {error} = await sb.from('books').update(patch).eq('id', b.id);
  if(error){ showToast('تعذّر تحديث الكتاب: ' + error.message, 'warn'); return false; }
  Object.assign(b, patch);
  renderCurrentBooks();
  const p = bookProgressPct(b);
  showToast(status === 'complete' && patch.status
    ? `🎉 أتممت «${b.name}»`
    : `📖 «${b.name}»: وصلت إلى ${lessonUnit(b)} ${next} (${p.pct}%)`);
  return true;
}

async function quickProgress(id){
  const b = booksCache.find(x => x.id === id);
  if(!b) return;
  const done = bookProgressPct(b).done;
  const unit = lessonUnit(b);
  const input = prompt(`وصلت إلى أي ${unit}؟ (الحالي: ${done})`, String(done + 1));
  if(input === null) return;
  const n = parseInt(normalizeDigits(input)) || 0;
  if(n <= 0) return;
  await recordProgress(b, n);
  await loadBooks();
}

const STATUS_LABELS = {todo:'لسا ما بدأت', in_progress:'أدرسه الحين', complete:'خلصته'};

const PRESET_SUBJECTS = ['نحو','صرف','بلاغة','منطق','أصول فقه','فقه','إملاء','علوم الكتاب والحديث','التفسير','الحديث','السيرة','الأدب','العلوم الطبيعية'];

function attrEscape(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function arabicNumeral(n){
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(n).split('').map(d=>map[d]||d).join('');
}

function bookProgressPct(b){
  if((b.kind || 'matn') === 'book'){
    const total = b.total_pages || 0;
    const done = b.completed_pages || 0;
    const pct = total>0 ? Math.min(100, Math.round((done/total)*100)) : 0;
    return {pct, done, total, unit:'صفحة'};
  }
  const total = b.total_lessons || 0;
  const done = b.completed_lessons || 0;
  const pct = total>0 ? Math.min(100, Math.round((done/total)*100)) : 0;
  return {pct, done, total, unit:'درس'};
}

function normalizeDigits(str){
  if(str === null || str === undefined) return str;
  const eastern = '٠١٢٣٤٥٦٧٨٩';
  const persian = '۰۱۲۳۴۵۶۷۸۹';
  return String(str).replace(/[٠-٩۰-۹]/g, ch => {
    let i = eastern.indexOf(ch);
    if(i === -1) i = persian.indexOf(ch);
    return i !== -1 ? String(i) : ch;
  });
}

async function trLoad(){
  if(!trPresetDone){ await ensurePresetSubjects(); trPresetDone = true; }
  const {data, error} = await sb.from('subjects').select('*').order('sort_order').order('created_at');
  const wrap = document.getElementById('treeWrap');

  await refreshBooksCache();
  trSubs = [...(data || [])].sort((a,b) => {
    const ai = PRESET_SUBJECTS.indexOf(a.name), bi = PRESET_SUBJECTS.indexOf(b.name);
    if(ai === -1 && bi === -1) return (a.sort_order || 0) - (b.sort_order || 0);
    if(ai === -1) return 1;
    if(bi === -1) return -1;
    return ai - bi;
  });
  if(trOpen && !trSubs.some(s => s.id === trOpen)){ trOpen = null; currentSubjectId = null; }

function trDraw(){

  trDrawn = true;
  wrap.innerHTML = `<div class="tr-trunk"></div>${trSubs.map((s,i) => trRowHtml(s, i, grow)).join('')}${TR_ROOTS}`;
}

function trBranchSvg(i, grow){
  return `<svg class="tr-branch${grow ? ' grow' : ''}" style="--d:${(i * 0.12).toFixed(2)}s" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">
    <path class="limb" pathLength="1" d="M0 38 C22 38,32 33,56 30 S86 27,100 30"/>
    <path class="limb2" pathLength="1" d="M0 38 C22 38,32 33,56 30 S86 27,100 30"/>
    <path class="twig" pathLength="1" d="${TR_TWIGS[i % 3]}"/>
  </svg>`;
}

function trRowHtml(s, i, grow){
  const side = i % 2 === 0 ? 'r' : 'l';
  const books = booksCache.filter(b => b.subject_id === s.id);
  const pcts = books.map(b => bookProgressPct(b).pct);
  const avg = pcts.length ? Math.round(pcts.reduce((a,c) => a + c, 0) / pcts.length) : 0;
  const open = trOpen === s.id;
  return `<div class="tr-row ${side}${open ? ' open' : ''}" id="tr-${s.id}">
    ${trBranchSvg(i, grow)}
    <button class="tr-node" onclick="trToggle('${s.id}')" aria-expanded="${open}">
      <span class="tr-name">${escapeHtml(s.name)}</span>
      <span class="tr-meta">${books.length ? books.length + ' كتاب/متن · ' + avg + '%' : 'لا كتب بعد'}</span>
      <span class="tr-bar"><i style="width:${avg}%"></i></span>
    </button>
    ${open ? trPanelHtml(s, books, avg) : ''}
  </div>`;
}

function trPanelHtml(s, books, avg){
  const matn = books.filter(b => (b.kind || 'matn') === 'matn');
  const pg = books.filter(b => (b.kind || 'matn') === 'book');
  const sum = (a, k) => a.reduce((t,b) => t + (b[k] || 0), 0);
  const bd = [
    matn.length ? `${sum(matn,'completed_lessons')}/${sum(matn,'total_lessons')} درس` : '',
    pg.length ? `${sum(pg,'completed_pages')}/${sum(pg,'total_pages')} صفحة` : ''
  ].filter(Boolean).join(' · ');
  const isCustom = !PRESET_SUBJECTS.includes(s.name);
  const rank = {in_progress:0, todo:1, complete:2};
  const curLevels = new Set(books.filter(b => b.status === 'in_progress').map(b => b.level || 1));
  const sorted = [...books].sort((a,b) =>
    ((curLevels.has(a.level || 1) ? 0 : 1) - (curLevels.has(b.level || 1) ? 0 : 1)) ||
    ((a.level || 1) - (b.level || 1)) ||
    ((rank[a.status] ?? 9) - (rank[b.status] ?? 9)) ||
    ((Number(a.sort_order) || 0) - (Number(b.sort_order) || 0)) ||
    String(a.created_at || '').localeCompare(String(b.created_at || '')));
  return `<div class="tr-panel">
    <div class="tr-panel-head">
      <span>متوسط الإنجاز ${avg}%${bd ? ' — ' + bd : ''}</span>
      <span class="tr-actions"><button onclick="trAddBook('${s.id}')">+ إضافة كتاب</button>${isCustom ? `<button onclick="deleteSubject('${s.id}')">حذف العلم</button>` : ''}</span>
    </div>
    <div id="bookFormWrap"></div>
    <div class="tr-books">${sorted.length ? sorted.map(trBookHtml).join('') : '<div class="tr-none">لسا ما أضفت كتب لهذا العلم. أضف أول كتاب أو متن ⤴</div>'}</div>
  </div>`;
}

function trBookHtml(b){

async function ensurePresetSubjects(){
  const {data:existing, error} = await sb.from('subjects').select('id,name');
  if(error) return;
  const existingNames = (existing||[]).map(s=>s.name);
  const missing = PRESET_SUBJECTS.filter(n => !existingNames.includes(n));
  if(missing.length){
    const rows = missing.map(name => ({name, sort_order: PRESET_SUBJECTS.indexOf(name)}));
    await sb.from('subjects').insert(rows);
  }
}

function changeBookKind(newKind){
  const draft = {
    id: editingBookId,
    name: document.getElementById('bkName').value,
    level: document.getElementById('bkLevel').value,
    kind: newKind,
    status: document.getElementById('bkStatus').value,
    current_lesson: document.getElementById('bkCurrent').value,
    total_lessons: 0, completed_lessons: 0, total_pages: 0, completed_pages: 0, volumes: 1
  };
  openBookForm(draft);
}

function cancelBookForm(){
  document.getElementById('bookFormWrap').innerHTML = '';
  editingBookId = null;
}

async function saveBook(){
  const id = editingBookId;
  const name = document.getElementById('bkName').value.trim();
  if(!name){ alert('اكتب اسم الكتاب أولاً'); return; }
  const kind = document.getElementById('bkKind').value;
  const payload = {
    subject_id: currentSubjectId,
    name,
    level: parseInt(normalizeDigits(document.getElementById('bkLevel').value)) || 1,
    kind,
    status: document.getElementById('bkStatus').value,
    current_lesson: document.getElementById('bkCurrent').value.trim()
  };
  if(kind === 'book'){
    const totalP = parseInt(normalizeDigits(document.getElementById('bkTotalPages').value)) || 0;
    let doneP = parseInt(normalizeDigits(document.getElementById('bkDonePages').value)) || 0;
    if(totalP > 0 && doneP > totalP) doneP = totalP;
    payload.total_pages = totalP;
    payload.completed_pages = doneP;
    payload.volumes = parseInt(normalizeDigits(document.getElementById('bkVolumes').value)) || 1;
    payload.total_lessons = 0;
    payload.completed_lessons = 0;
  } else {
    const totalL = parseInt(normalizeDigits(document.getElementById('bkTotal').value)) || 0;
    let doneL = parseInt(normalizeDigits(document.getElementById('bkDone').value)) || 0;
    if(totalL > 0 && doneL > totalL) doneL = totalL;
    payload.total_lessons = totalL;
    payload.completed_lessons = doneL;
    payload.total_pages = 0;
    payload.completed_pages = 0;
    payload.volumes = 1;
  }
  let error;
  if(id){
    ({error} = await sb.from('books').update(payload).eq('id', id));
  } else {
    ({error} = await sb.from('books').insert(payload));
  }
  if(error){ alert('صار خطأ: '+error.message); return; }
  document.getElementById('bookFormWrap').innerHTML = '';
  editingBookId = null;
  await loadBooks();
}

async function deleteBook(id){
  if(!confirm('حذف هذا الكتاب؟')) return;
  const book = booksCache.find(b => b.id === id);
  const linkedRes = await sb.from('entries').select('id').eq('book_id', id);
  const linked = (linkedRes.data || []).map(x => x.id);
  const {error} = await sb.from('books').delete().eq('id', id);
  if(error){ alert('صار خطأ: ' + error.message); return; }
  await loadBooks();
  if(book) showToast(`تم حذف «${book.name}»`, 'info', {label:'تراجع', onClick: () => restoreBook(book, linked)});
}

async function restoreBook(book, entryIds){
  const {subjects, ...row} = book;
  const {error} = await sb.from('books').insert(row);
  if(error){ showToast('تعذّر التراجع: ' + error.message, 'warn'); return; }
  if(entryIds.length) await sb.from('entries').update({book_id: book.id}).in('id', entryIds);
  await loadBooks();
  await loadEntries();
  showToast('تم التراجع ✓');
}

function updateFocusTarget(){

function updateFocusLinkUi(){
  const input = document.getElementById('focusLesson');
  if(!input) return;
  const b = booksCache.find(x => x.id === focusBookId);
  input.value = focusLessonNo;
  input.disabled = !b;

    input.placeholder = 'اختر كتابًا أولاً';
    document.getElementById('focusLessonLabel').textContent = 'رقم الدرس';
    hint.textContent = '';

    const unit = lessonUnit(b);

function collectFocusLink(){
  const b = booksCache.find(x => x.id === focusBookId) || null;

      </div>
      <div class="focus-display" id="timerDisplay">--:--</div>
      <div class="focus-target" id="focusTarget"></div>
      <label class="focus-check"><input type="checkbox" id="autoLog" checked> أضف الجلسة تلقائيًا للسجل اليومي عند الانتهاء</label>
      <div class="focus-controls" id="focusControls"></div>
      <div id="focusBanner"></div>
    `;
  } else {
    panel.innerHTML = `
      <div class="focus-phase-label">تبدأ من صفر وتستمر لين توقفها بنفسك</div>

      <div class="focus-target" id="focusTarget"></div>
      <label class="focus-check"><input type="checkbox" id="autoLog" checked> سجّل الجلسة تلقائيًا بالسجل اليومي عند الإنهاء</label>
      <div class="focus-controls" id="focusControls"></div>

function renderFocusControls(){
  const el = document.getElementById('focusControls');
  if(!el) return;
  if(timerMode === 'stopwatch'){
    if(stopwatchRunning){
      el.innerHTML = `
        <button class="ghost" onclick="pauseStopwatch()">إيقاف مؤقت</button>
        <button class="primary" onclick="finishStopwatch()">إنهاء الجلسة</button>
      `;
    } else if(stopwatchElapsedMs > 0){
      el.innerHTML = `
        <button class="primary" onclick="resumeStopwatch()">استمرار</button>
        <button class="ghost" onclick="finishStopwatch()">إنهاء الجلسة</button>
      `;
    } else {
      el.innerHTML = `<button class="primary" onclick="startStopwatch()">ابدأ</button>`;
    }
    return;
  }
  if(timerRunning){
    el.innerHTML = `
      <button class="ghost" onclick="pauseTimer()">إيقاف مؤقت</button>
      <button class="ghost" onclick="resetTimer()">إعادة تعيين</button>
    `;
  } else if(timerRemainingMs > 0){
    el.innerHTML = `
      <button class="primary" onclick="resumeTimer()">استمرار</button>
      <button class="ghost" onclick="resetTimer()">إعادة تعيين</button>
    `;
  } else {
    el.innerHTML = `<button class="primary" onclick="startTimer()">ابدأ</button>`;
  }

function disableFocusInputs(disabled){
  ['pmWork','pmShort','pmLong','pmRounds','freeMinutes'].forEach(id=>{
    const elx = document.getElementById(id);
    if(elx) elx.disabled = disabled;
  });
}

function formatElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const hh = Math.floor(totalSec/3600);
  const mm = Math.floor((totalSec%3600)/60);
  const ss = totalSec%60;
  if(hh > 0){
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }
  return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

function updateStopwatchDisplay(ms){
  const disp = document.getElementById('timerDisplay');
  if(!disp) return;
  disp.textContent = formatElapsed(ms);
  document.title = stopwatchRunning ? `${formatElapsed(ms)} • ${BASE_TITLE}` : BASE_TITLE;
}

function startStopwatch(){
  stopwatchElapsedMs = 0;
  const banner = document.getElementById('focusBanner');
  if(banner) banner.innerHTML = '';
  runStopwatch();
}

function resumeStopwatch(){
  const banner = document.getElementById('focusBanner');
  if(banner) banner.innerHTML = '';
  runStopwatch();
}

function runStopwatch(){
  stopwatchStartRef = Date.now();
  stopwatchRunning = true;
  renderFocusControls();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickStopwatch, 250);
  tickStopwatch();
}

function pauseStopwatch(){
  stopwatchElapsedMs += Date.now() - stopwatchStartRef;
  stopwatchRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  document.title = BASE_TITLE;
  renderFocusControls();
}

function tickStopwatch(){
  if(!stopwatchRunning) return;
  const live = stopwatchElapsedMs + (Date.now() - stopwatchStartRef);
  updateStopwatchDisplay(live);
}

async function finishStopwatch(){
  let finalMs = stopwatchElapsedMs;
  if(stopwatchRunning){
    finalMs += Date.now() - stopwatchStartRef;
  }
  clearInterval(timerInterval);
  timerInterval = null;
  stopwatchRunning = false;
  const minutesDone = Math.round(finalMs/60000);

  const tagEl = document.getElementById('focusTag');
  const tagVal = tagEl ? tagEl.value.trim() : '';
  const autoLogEl = document.getElementById('autoLog');
  const shouldLog = autoLogEl ? autoLogEl.checked : true;

  const link = collectFocusLink();
  if(minutesDone >= 1 && shouldLog){
    await logFocusSession(minutesDone, 'ساعة توقف', tagVal, link);
  }
  if(link.book && link.n && !link.review){ await recordProgress(link.book, link.n); }

  stopwatchElapsedMs = 0;
  stopwatchStartRef = null;
  renderFocusControls();
  updateStopwatchDisplay(0);

  const banner = document.getElementById('focusBanner');
  if(banner){
    banner.innerHTML = `
      <div class="focus-banner">
        <div>✅ انتهت الجلسة — ${minutesDone} دقيقة</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:10px">
          <button class="primary" onclick="document.getElementById('focusBanner').innerHTML=''">تم</button>
        </div>
      </div>
    `;
  }
}

function getPhaseDurationMinutes(){
  if(timerMode === 'free'){
    const fEl = document.getElementById('freeMinutes');
    return fEl ? (parseInt(normalizeDigits(fEl.value)) || 20) : 20;
  }
  if(pomodoroPhase === 'work'){
    const e2 = document.getElementById('pmWork');
    return e2 ? (parseInt(normalizeDigits(e2.value)) || 25) : 25;
  }
  if(pomodoroPhase === 'short'){
    const e3 = document.getElementById('pmShort');
    return e3 ? (parseInt(normalizeDigits(e3.value)) || 5) : 5;
  }
  const e4 = document.getElementById('pmLong');
  return e4 ? (parseInt(normalizeDigits(e4.value)) || 15) : 15;
}

function startTimer(){
  const minutes = getPhaseDurationMinutes();
  if(minutes <= 0){ alert('حدد عدد دقائق أكبر من صفر'); return; }
  timerRemainingMs = minutes * 60000;
  const banner = document.getElementById('focusBanner');
  if(banner) banner.innerHTML = '';
  runTimer();
}

function resumeTimer(){
  const banner = document.getElementById('focusBanner');
  if(banner) banner.innerHTML = '';
  runTimer();
}

function runTimer(){
  try{
    getAudioCtx();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  timerEndAt = Date.now() + timerRemainingMs;
  timerRunning = true;
  renderFocusControls();
  disableFocusInputs(true);
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function pauseTimer(){
  timerRemainingMs = Math.max(0, timerEndAt - Date.now());
  timerRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  document.title = BASE_TITLE;
  renderFocusControls();
  disableFocusInputs(false);
}

function resetTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  timerRemainingMs = 0;
  timerEndAt = null;
  stopAlarm();
  const banner = document.getElementById('focusBanner');
  if(banner) banner.innerHTML = '';
  renderFocusControls();
  disableFocusInputs(false);
  updateTimerDisplay();
}

function tickTimer(){
  if(!timerRunning) return;
  const remaining = timerEndAt - Date.now();
  if(remaining <= 0){
    timerRemainingMs = 0;
    updateTimerDisplay();
    onTimerComplete();
    return;
  }
  timerRemainingMs = remaining;
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const disp = document.getElementById('timerDisplay');
  if(!disp) return;
  let ms = timerRemainingMs;
  if((!ms || ms<=0) && !timerRunning){
    ms = getPhaseDurationMinutes() * 60000;
  }
  const totalSec = Math.max(0, Math.ceil(ms/1000));
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  disp.textContent = `${mm}:${ss}`;
  document.title = timerRunning ? `${mm}:${ss} • ${BASE_TITLE}` : BASE_TITLE;
}

async function onTimerComplete(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  document.title = BASE_TITLE;
  renderFocusControls();
  disableFocusInputs(false);
  playAlarm();

  const minutesDone = getPhaseDurationMinutes();
  const tagEl = document.getElementById('focusTag');
  const tagVal = tagEl ? tagEl.value.trim() : '';
  const autoLogEl = document.getElementById('autoLog');
  const shouldLog = autoLogEl ? autoLogEl.checked : true;
  const phaseLabel = timerMode === 'pomodoro' ? POMODORO_PHASE_LABELS[pomodoroPhase] : 'مؤقت حر';

  const isWork = (timerMode === 'free' || pomodoroPhase === 'work');
  const link = collectFocusLink();
  if(shouldLog && isWork){
    await logFocusSession(minutesDone, phaseLabel, tagVal, link);
  }
  if(isWork && link.book && link.n && !link.review){
    await recordProgress(link.book, link.n);
  }

  const banner = document.getElementById('focusBanner');
  if(banner){
    banner.innerHTML = `
      <div class="focus-banner">
        <div>⏰ انتهى الوقت! (${escapeHtml(phaseLabel)})</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:10px">
          <button class="ghost" onclick="stopAlarm()">إيقاف الصوت</button>
          ${timerMode==='pomodoro' ? `<button class="primary" onclick="advancePomodoro()">التالي</button>` : `<button class="primary" onclick="resetTimer()">تم</button>`}
        </div>
      </div>
    `;
  }
}

async function logFocusSession(minutes, phaseLabel, tag, link){
  const book = link && link.book;
  const n = (link && link.n) || 0;
  const review = !!(link && link.review) || isReviewText(tag);
  const parts = splitTags(tag);
  if(book && !parts.includes(book.name)) parts.push(book.name);
  let where = '';
  if(book){
    const unit = lessonUnit(book);
    where = ` — ${book.name}${n ? `، ${review ? 'مراجعة ' : ''}${unit} ${n}` : ''}`;
    if(n && unit === 'درس' && !review) parts.push(`درس: ${book.name} — الدرس ${n}`);
  }
  const payload = {
    entry_date: toDateStr(new Date()),
    type: 'tarkiz',
    content: `جلسة تركيز (${phaseLabel}): ${minutes} دقيقة${where}`,
    tags: parts.join(', '),
    focus_minutes: minutes,
    book_id: book ? book.id : null,
    lesson_number: n || null
  };
  const {error} = await saveEntryRow(payload);
  if(error){
    // لا نحفظ نسخة غير مربوطة بالكتاب؛ وإلا تختفي الجلسة من إحصائياته ولا يمكن تعديلها لاحقًا.
    showToast('تعذّر حفظ جلسة التركيز: ' + error.message, 'warn');
  }
}

function advancePomodoro(){
  const roundsEl = document.getElementById('pmRounds');
  const rounds = roundsEl ? (parseInt(normalizeDigits(roundsEl.value)) || 4) : 4;
  if(pomodoroPhase === 'work'){
    if(pomodoroRound >= rounds){
      pomodoroPhase = 'long';
      pomodoroRound = 1;
    } else {
      pomodoroPhase = 'short';
    }
  } else {
    if(pomodoroPhase === 'short'){ pomodoroRound++; }
    pomodoroPhase = 'work';
  }
  timerRemainingMs = 0;
  renderFocusPanel();
}

function changeAlarmSound(val){
  alarmSound = val;
  localStorage.setItem('rihla_alarm', val);
}

function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  return audioCtx;
}

function beep(freq, duration, delay){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  }catch(e){}
}

function playSoundOnce(){
  if(alarmSound === 'bell'){
    beep(880, 0.35, 0);
    beep(660, 0.35, 0.4);
  } else if(alarmSound === 'chime'){
    beep(523.25, 0.5, 0);
    beep(659.25, 0.5, 0.15);
    beep(783.99, 0.6, 0.3);
  } else {
    beep(700, 0.12, 0);
    beep(700, 0.12, 0.2);
    beep(700, 0.12, 0.4);
  }
}

function playAlarm(){
  playSoundOnce();
  let count = 1;
  alarmLoopInterval = setInterval(()=>{
    if(count >= 4){ clearInterval(alarmLoopInterval); alarmLoopInterval = null; return; }
    playSoundOnce();
    count++;
  }, 1800);
}

function stopAlarm(){
  if(alarmLoopInterval){ clearInterval(alarmLoopInterval); alarmLoopInterval = null; }
}

async function saveEntryRow(payload, id){
  const run = p => id
    ? sb.from('entries').update(p).eq('id', id)
    : sb.from('entries').insert(p);
  return run(payload);
}

async function addEntry(){
  const date = document.getElementById('dateInput').value || toDateStr(new Date());
  const book = booksCache.find(b => b.id === document.getElementById('entryBook').value) || null;
  const lessonNo = parseInt(normalizeDigits(document.getElementById('entryLesson').value)) || 0;
  if(!book){ alert('اختر الكتاب أولاً'); return; }
  if(!lessonNo){ alert('اكتب رقم ' + lessonUnit(book)); return; }
  const minutes = parseInt(normalizeDigits(document.getElementById('entryMinutes').value)) || 0;
  if(minutes <= 0){ alert('اكتب الوقت بالدقائق'); return; }
  const unit = lessonUnit(book);
  const review = document.getElementById('entryReview').checked;
  const tags = [book.name];
  if(review) tags.push('مراجعة');
  else if(unit === 'درس') tags.push(`درس: ${book.name} — الدرس ${lessonNo}`);
  const payload = {
    entry_date: date,
    type: 'tarkiz',
    content: `${review ? 'جلسة مراجعة' : 'جلسة تركيز'}: ${book.name} — ${unit} ${lessonNo} — ${minutes} دقيقة`,
    tags: tags.join(', '),
    focus_minutes: minutes,
    book_id: book.id,
    lesson_number: lessonNo
  };
  const {error} = await saveEntryRow(payload, editingEntryId);
  if(error){ alert('صار خطأ: '+error.message); return; }
  if(!review) await recordProgress(book, lessonNo);
  cancelEditEntry();
  await loadEntries();
}

function findBookIdFromTags(tags){
  const normalizedTags = new Set(splitTags(tags).map(normalizeLessonKey));
  const matches = booksCache.filter(book => normalizedTags.has(normalizeLessonKey(book.name)));
  // لا نخمن عند وجود كتابين بالاسم نفسه؛ يختاره المستخدم بنفسه عند التعديل.
  return matches.length === 1 ? matches[0].id : '';
}

function startEditEntry(id){
  const entry = entriesById.get(id);
  if(!entry) return;
  editingEntryId = id;
  const sel = document.getElementById('entryBook');
  // القيود القديمة قد تكون محفوظة قبل إضافة book_id؛ نستعيد الكتاب من الوسم إن أمكن.
  const linkedBookId = entry.book_id || findBookIdFromTags(entry.tags);

  sel.value = linkedBookId || '';

  document.getElementById('cancelEditWrap').style.display = '';
  document.querySelector('.entry-box').scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEditEntry(){
  editingEntryId = null;
  const sel = document.getElementById('entryBook');
  if(!sel) return;
  sel.innerHTML = bookOptionsHtml('');
  sel.value = '';
  document.getElementById('entryLesson').value = '';
  document.getElementById('entryMinutes').value = '';

async function deleteEntry(id){
  const row = entriesById.get(id);
  if(!row) return;
  const {error} = await sb.from('entries').delete().eq('id', id);
  if(error){ alert('صار خطأ: ' + error.message); return; }
  await loadEntries();
  showToast('تم حذف القيد', 'info', {label:'تراجع', onClick: () => restoreEntries([row])});
}

async function restoreEntries(rows){
  const {error} = await sb.from('entries').insert(rows);
  if(error){ showToast('تعذّر التراجع: ' + error.message, 'warn'); return; }
  await loadEntries();
  showToast('تم التراجع ✓');
}

async function loadEntries(){
  let data = [], error = null;
  try{
    data = await fetchAllRows('entries', q => q.order('entry_date', {ascending:false}).order('created_at', {ascending:false}).order('id'));
  }catch(e){ error = e; }
  const timeline = document.getElementById('timeline');
  if(!timeline) return;
  if(error){ timeline.innerHTML = `<div class="empty">تعذّر تحميل السجل: ${error.message}</div>`; return; }
  entriesCache = data || [];
  entriesById = new Map(entriesCache.map(entry => [entry.id, entry]));
  renderStats(entriesCache);
  renderTimeline();
}

function mainTagOf(entry){
  return splitTags(entry.tags)[0] || 'بدون وسم';
}

async function deleteTagGroup(tag){
  const group = entriesCache.filter(e => mainTagOf(e) === tag);
  if(!group.length) return;
  const sessions = group.filter(e => e.type === 'tarkiz');
  const minutes = sessions.reduce((sum, e) => sum + (e.focus_minutes || 0), 0);
  const label = tag === 'بدون وسم' ? 'القيود بدون وسم' : `الوسم «${tag}»`;
  const details = `${group.length} قيد` + (sessions.length ? ` (منها ${sessions.length} جلسة تركيز بمجموع ${minutes} دقيقة)` : '');
  if(!confirm(`⚠️ تحذير\n\nسيتم حذف ${label} نهائيًا مع كل قيوده: ${details}.\n\nسيتغير ملخص الشهر ووقت التركيز. تقدّم الكتب في «الطريق» لا يتأثر.\nبعد الحذف يظهر زر «تراجع» لبضع ثوانٍ فقط.\n\nهل تريد المتابعة؟`)) return;
  const {error} = await sb.from('entries').delete().in('id', group.map(e => e.id));
  if(error){ alert('صار خطأ: ' + error.message); return; }
  collapsedTagGroups.delete(tag);
  localStorage.setItem('rihla_collapsed_tag_groups', JSON.stringify([...collapsedTagGroups]));
  showToast(`تم حذف ${group.length} قيد`, 'info', {label:'تراجع', onClick: () => restoreEntries(group)});
  await loadEntries();
}

let tagSearchTimer = null;

    </section>
  `).join('');

function splitTags(value){
  return (value||'').split(/[,،]/).map(tag=>tag.trim()).filter(Boolean);
}

function normalizeLessonKey(value){
  return value
    .normalize('NFKC')
    .replace(/[ـًٌٍَُِّْ]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/[‐‑–—―-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLocaleLowerCase('ar');
}

function entryMonthKey(entryDate){
  return String(entryDate || '').slice(0, 7);
}

function monthLabelFromKey(key){
  if(!key) return 'بدون شهر';
  const [year, month] = key.split('-').map(Number);
  if(!year || !month) return key;
  return new Date(year, month - 1, 1).toLocaleDateString('ar-SA', {month:'long', year:'numeric'});
}

function shiftMonthlySummaryMonth(step){
  if(!monthlySummaryKeys.length) return;
  const nextIndex = Math.max(0, Math.min(monthlySummaryKeys.length - 1, currentMonthlySummaryIndex + step));
  if(nextIndex === currentMonthlySummaryIndex) return;
  selectedMonthlySummaryKey = monthlySummaryKeys[nextIndex];
  renderStats();
}

function isReviewText(text){
  return /مراجع/.test(text || '');
}

function isReviewEntry(entry){
  return splitTags(entry.tags).some(isReviewText);
}

function lessonKeys(entries){
  const keys = new Set();
  (entries||[]).forEach(entry => {
    if(isReviewEntry(entry)) return;   // المراجعة ليست درسًا جديدًا
    splitTags(entry.tags).forEach(tag => {
      // لا يكفي وسم «درس» وحده: لا بد من اسم/رقم ثابت حتى نميّز الدرس الجديد عن جلسة متابعة له.
      const match = tag.match(/^درس\s*:\s*(.+)$/i);
      if(match && match[1].trim()) keys.add(normalizeLessonKey(match[1]));
    });
  });
  return keys;
}

function setMonthlySummaryVisibility(){
  const card = document.getElementById('monthlySummaryCard');
  const btn = document.getElementById('monthlySummaryToggle');
  if(card) card.classList.toggle('collapsed', !monthlySummaryVisible);

function toggleMonthlySummary(){

}

function toggleTagGroup(button){
  const tag = button.dataset.tag;
  const group = button.closest('.tag-group');
  const isCollapsed = !group.classList.contains('collapsed');
  group.classList.toggle('collapsed', isCollapsed);
  button.setAttribute('aria-expanded', String(!isCollapsed));
  if(isCollapsed) collapsedTagGroups.add(tag);
  else collapsedTagGroups.delete(tag);
  localStorage.setItem('rihla_collapsed_tag_groups', JSON.stringify([...collapsedTagGroups]));
}

function renderStats(list){
  const entries = list || entriesCache || [];
  const streak = computeStreak(entries.map(e => e.entry_date));
  renderDailyGoal(entries);
  renderVacationBar();
  renderBackupReminder();
  renderBackupInfo();
  const availableKeys = [...new Set(entries.map(e => entryMonthKey(e.entry_date)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  monthlySummaryKeys = availableKeys.length ? availableKeys : [currentMonthKey];
  if(selectedMonthlySummaryKey && !monthlySummaryKeys.includes(selectedMonthlySummaryKey)){
    selectedMonthlySummaryKey = null;
  }
  const selectedKey = selectedMonthlySummaryKey || (monthlySummaryKeys.includes(currentMonthKey) ? currentMonthKey : monthlySummaryKeys[0]);
  currentMonthlySummaryIndex = Math.max(0, monthlySummaryKeys.indexOf(selectedKey));
  selectedMonthlySummaryKey = monthlySummaryKeys[currentMonthlySummaryIndex] || currentMonthKey;

  const monthEntries = entries.filter(e => entryMonthKey(e.entry_date) === selectedMonthlySummaryKey);
  const focusEntries = monthEntries.filter(e=>e.type==='tarkiz');
  const focusMinutesTotal = focusEntries.reduce((s,e)=>s+(e.focus_minutes||0),0);
  const focusTimeLabel = focusMinutesTotal >= 60
    ? `${Math.floor(focusMinutesTotal/60)}س ${focusMinutesTotal%60}د`
    : `${focusMinutesTotal}د`;

  const summaryEl = document.getElementById('monthlySummary');
  if(summaryEl){
    const monthLabel = monthLabelFromKey(selectedMonthlySummaryKey);
    const lessonsCount = lessonKeys(monthEntries).size;
    const atNewest = currentMonthlySummaryIndex === 0;
    const atOldest = currentMonthlySummaryIndex === monthlySummaryKeys.length - 1;
    summaryEl.innerHTML = `
      <section class="monthly-summary-card" id="monthlySummaryCard">
        <button class="monthly-summary-toggle" id="monthlySummaryToggle" onclick="toggleMonthlySummary()" aria-expanded="true">
          <span class="monthly-summary-title">ملخص ${monthLabel}</span>
          <span class="monthly-summary-brief">${lessonsCount} دروس · ${focusTimeLabel} تركيز${streak > 1 ? ' · 🔥 ' + streak : ''}</span>
          <span class="summary-chevron">⌄</span>
        </button>
        <div class="monthly-summary-content">
          <div>
            درست <b>${lessonsCount}</b> ${lessonsCount===1 ? 'درسًا' : 'دروس'}، ومجموع وقت التركيز <b>${focusTimeLabel}</b>.
            ${streak > 0 ? `<div style="margin-top:4px">🔥 سلسلة التسجيل المتتالية: <b>${streak}</b> ${streak===1 ? 'يوم' : 'أيام'}</div>` : ''}
            <div style="font-size:.75rem;color:var(--ink-soft);margin-top:5px">يُحتسب الدرس مرة واحدة ولو تكرر في عدة جلسات. اربط القيد أو جلسة التركيز بكتاب من «الطريق» وسيُحتسب تلقائيًا.</div>
            <div class="monthly-summary-nav">
              <button class="ghost monthly-nav-btn" onclick="shiftMonthlySummaryMonth(1)" ${atOldest ? 'disabled' : ''}>← الشهر السابق</button>
              <button class="ghost monthly-nav-btn" onclick="shiftMonthlySummaryMonth(-1)" ${atNewest ? 'disabled' : ''}>الشهر التالي →</button>
            </div>
          </div>
        </div>
      </section>`;
    setMonthlySummaryVisibility();
  }
}

/* ============ جلب كل الصفوف (Supabase يقطع النتائج عند 1000) ============ */

async function fetchAllRows(table, build){
  const out = [];
  const size = 1000;
  for(let from = 0; ; from += size){
    let q = sb.from(table).select('*');
    if(build) q = build(q);
    const {data, error} = await q.range(from, from + size - 1);
    if(error) throw error;
    out.push(...(data || []));
    if(!data || data.length < size) break;
  }
  return out;
}

/* ============ الهدف اليومي (بالدروس) ============ */

function getDailyGoal(){
  return parseInt(localStorage.getItem('rihla_daily_goal') || '0') || 0;
}

function setDailyGoal(){
  const cur = getDailyGoal();
  const input = prompt('كم درسًا تريد إنجازه يوميًا؟ (اكتب 0 لإلغاء الهدف)', String(cur || 1));
  if(input === null) return;
  const n = Math.max(0, Math.min(50, parseInt(normalizeDigits(input)) || 0));
  localStorage.setItem('rihla_daily_goal', String(n));
  renderDailyGoal();
}

function entriesByDate(entries){
  const map = new Map();
  (entries || []).forEach(e => {
    if(!map.has(e.entry_date)) map.set(e.entry_date, []);
    map.get(e.entry_date).push(e);
  });
  return map;
}

function lessonsOnDate(byDate, dateStr){
  return lessonKeys(byDate.get(dateStr) || []).size;
}

function renderDailyGoal(entries){
  const el = document.getElementById('dailyGoal');
  if(!el) return;
  const goal = getDailyGoal();
  if(!goal){
    el.innerHTML = `<div class="goal-card"><div class="goal-row"><span>🎯 هدف اليوم</span><button class="ghost" onclick="setDailyGoal()">حدّد هدفك اليومي بالدروس</button></div></div>`;
    return;
  }
  const today = lessonsOnDate(entriesByDate(entries || entriesCache), toDateStr(new Date()));
  const pct = Math.min(100, Math.round(today / goal * 100));
  const done = today >= goal;
  el.innerHTML = `
    <div class="goal-card ${done ? 'goal-done' : ''}">
      <div class="goal-row">
        <span>🎯 هدف اليوم: <b>${today}</b> / ${goal} ${goal === 1 ? 'درس' : 'دروس'}</span>
        <button class="ghost" onclick="setDailyGoal()">تغيير</button>
      </div>
      <div class="sj-progress-bar" style="margin:8px 0 0"><div class="sj-progress-fill" style="width:${pct}%"></div></div>
      ${done ? '<div class="hint" style="color:var(--green)">أنجزت هدف اليوم، بارك الله فيك ✓</div>' : '<div class="hint">يُحسب كل درس مرة واحدة في اليوم. جلسات «مراجعة» لا تُحسب.</div>'}
    </div>`;
}

/* ============ أيام الإجازة: لا تكسر سلسلة المداومة ============ */

const VAC_KEY = 'rihla_vacations';
let vacOpen = false;

function getVacations(){
  try{ return new Set(JSON.parse(localStorage.getItem(VAC_KEY) || '[]')); }catch(e){ return new Set(); }
}
function saveVacations(set){
  try{ localStorage.setItem(VAC_KEY, JSON.stringify([...set].sort())); }catch(e){}
}
function vacNext(ds){
  const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + 1); return toDateStr(d);
}
function vacRanges(set){
  const out = [];
  [...set].sort().forEach(ds => {
    const last = out[out.length - 1];
    if(last && vacNext(last.to) === ds) last.to = ds; else out.push({from:ds, to:ds});
  });
  return out;
}
function vacRefresh(){
  renderStats(entriesCache);
  if(typeof renderProfileView === 'function') renderProfileView();
}
function toggleVacationToday(){
  const s = getVacations(), t = toDateStr(new Date());
  if(s.has(t)) s.delete(t); else s.add(t);
  saveVacations(s);
  vacRefresh();
}
function addVacationRange(){
  const f = document.getElementById('vacFrom')?.value;
  const t = document.getElementById('vacTo')?.value || f;
  if(!f){ showToast('اختر تاريخ البداية', 'warn'); return; }
  if(t < f){ showToast('تاريخ النهاية قبل البداية', 'warn'); return; }
  const s = getVacations();
  let d = f, n = 0;
  while(d <= t && n < 90){ s.add(d); d = vacNext(d); n++; }
  if(d <= t) showToast('الحد الأقصى ٩٠ يومًا في الإضافة الواحدة', 'warn');
  saveVacations(s);
  vacOpen = false;
  vacRefresh();
  showToast('تمت إضافة الإجازة ✓');
}
function removeVacationRange(from, to){
  const s = getVacations();
  let d = from;
  while(d <= to){ s.delete(d); d = vacNext(d); }
  saveVacations(s);
  vacRefresh();
}
function renderVacationBar(){

function renderCalendar(entries){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const firstWeekday = new Date(y, m, 1).getDay();
  const studied = new Set((entries || []).filter(e => e.entry_date && e.entry_date.slice(0,7) === `${y}-${String(m+1).padStart(2,'0')}`).map(e => Number(e.entry_date.slice(8,10))));
  const labels = ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
  const cells = [];
  for(let i=0; i<firstWeekday; i++) cells.push('<div class="calendar-day empty-day"></div>');
  for(let day=1; day<=daysInMonth; day++){
    const active = studied.has(day);
    const today = day === now.getDate();
    cells.push(`<div class="calendar-day${active ? ' studied' : ''}${today ? ' today' : ''}" title="${active ? 'تمت الدراسة في هذا اليوم' : ''}">${arabicNumeral(day)}</div>`);
  }
  return `<div class="calendar-card"><div class="timeline-head"><h2>تقويم الدراسة — ${now.toLocaleDateString('ar-SA',{month:'long',year:'numeric'})}</h2></div><div class="calendar-grid">${labels.map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${cells.join('')}</div><div class="hint" style="margin-top:10px">الأخضر: يوم سجّلت فيه دراسة أو جلسة تركيز.</div></div>`;
}

function pfDate(ds){
  return new Date(ds + 'T00:00:00').toLocaleDateString('ar-u-nu-latn-ca-gregory', {day:'numeric', month:'long', year:'numeric'});
}

// أطول سلسلة أيام متتالية + أول تاريخ بلغت فيه السلسلة كل طول
function pfLongestStreak(dates){
  const days = [...new Set((dates || []).filter(Boolean))].sort();
  const vac = getVacations();
  const DAY = 86400000;
  const bridged = (a, b) => {
    for(let x = a + DAY; x < b; x += DAY){
      if(!vac.has(new Date(x).toISOString().slice(0,10))) return false;
    }
    return true;
  };
  let best = 0, run = 0, prev = null;
  const reached = {};
  days.forEach(ds => {
    const t = Date.UTC(+ds.slice(0,4), +ds.slice(5,7) - 1, +ds.slice(8,10));
    run = (prev !== null && bridged(prev, t)) ? run + 1 : 1;
    prev = t;
    if(run > best) best = run;
    if(reached[run] === undefined) reached[run] = ds;
  });
  return {best, reached};
}

// أول تاريخ بلغ فيه المجموع التراكمي كل عتبة
function pfCumulative(items, thresholds){
  const out = {};
  let sum = 0;
  items.forEach(it => {
    sum += it.n;
    thresholds.forEach(t => { if(out[t] === undefined && sum >= t) out[t] = it.date; });
  });
  return out;
}

// تواريخ أول ظهور لكل درس/صفحة مختلفة (دون المراجعات)
function pfUnitItems(entries, books, wantPages){
  const isPagesById = new Map(books.map(b => [b.id, lessonUnit(b) === 'صفحة']));
  const seen = new Set();
  const out = [];
  entries
    .filter(e => e.book_id && e.lesson_number && !isReviewEntry(e) && isPagesById.get(e.book_id) === wantPages)
    .sort((a,b) => (a.entry_date || '').localeCompare(b.entry_date || ''))
    .forEach(e => {
      const k = e.book_id + ':' + e.lesson_number;
      if(seen.has(k)) return;
      seen.add(k);
      out.push({date:e.entry_date, n:1});
    });
  return out;
}

function pfComputeStats(entries, books){
  const tark = entries.filter(e => e.type === 'tarkiz');
  const focusMinutes = tark.reduce((s,e) => s + Math.max(0, Number(e.focus_minutes) || 0), 0);
  const dates = entries.map(e => e.entry_date);
  const {best, reached} = pfLongestStreak(dates);
  return {
    focusMinutes,
    sessions: tark.length,
    bestStreak: best,
    streakReached: reached,
    currentStreak: computeStreak(dates),
    booksRead: books.filter(b => b.status === 'complete').length,
    booksTotal: books.length,
    lessons: books.reduce((s,b) => s + (Number(b.completed_lessons) || 0), 0),
    pages: books.reduce((s,b) => s + (Number(b.completed_pages) || 0), 0)
  };
}

function pfBuildBadges(entries, books, st){
  const latest = entries.reduce((m,e) => (e.entry_date && e.entry_date > m) ? e.entry_date : m, '') || toDateStr(new Date());
  const tark = entries.filter(e => e.type === 'tarkiz')
    .sort((a,b) => (a.entry_date || '').localeCompare(b.entry_date || ''));
  const defs = [];
  const add = (kind, list, current, dateMap, fmtProgress) => {
    list.forEach(([t, title, content]) => {
      const earned = current >= t;
      defs.push({
        kind, title, content, earned,
        flame: kind === 'streak',
        date: earned ? (dateMap[t] || latest) : null,
        progress: fmtProgress(current, t)
      });
    });
  };

  add('streak',
    [[1,'وسام البداية',1],[5,'وسام الثبات',5],[10,'وسام الهمّة',10],[15,'وسام العزم',15],[30,'وسام الاستقامة',30],[60,'وسام الرسوخ',60],[100,'وسام الجبل',100]],
    st.bestStreak, st.streakReached,
    (c,t) => `${Math.min(c,t)}/${t} يوم`);

  add('focus',
    [[60,'ساعة صفاء','⏱'],[600,'عشر ساعات تركيز','⏳'],[3000,'خمسون ساعة','🏆'],[6000,'مئة ساعة','👑']],
    st.focusMinutes,
    pfCumulative(tark.map(e => ({date:e.entry_date, n:Math.max(0, Number(e.focus_minutes) || 0)})), [60,600,3000,6000]),
    (c,t) => `${Math.floor(Math.min(c,t)/60)}/${t/60} ساعة`);

  add('sessions',
    [[1,'أولى الجلسات','🎯'],[10,'عشر جلسات','🎯'],[50,'خمسون جلسة','🎯']],
    st.sessions,
    pfCumulative(tark.map(e => ({date:e.entry_date, n:1})), [1,10,50]),
    (c,t) => `${Math.min(c,t)}/${t} جلسة`);

  add('lessons',
    [[10,'عشرة دروس','📝'],[50,'خمسون درسًا','📝'],[100,'مئة درس','📝'],[250,'مئتان وخمسون درسًا','📝']],
    st.lessons,
    pfCumulative(pfUnitItems(entries, books, false), [10,50,100,250]),
    (c,t) => `${Math.min(c,t)}/${t} درس`);

  add('pages',
    [[100,'مئة صفحة','📄'],[500,'خمسمئة صفحة','📄'],[1000,'ألف صفحة','📄'],[5000,'خمسة آلاف صفحة','📄']],
    st.pages,
    pfCumulative(pfUnitItems(entries, books, true), [100,500,1000,5000]),
    (c,t) => `${Math.min(c,t)}/${t} صفحة`);

  // تاريخ ختم الكتاب: آخر قيد مرتبط به
  const lastEntry = new Map();
  entries.forEach(e => {
    if(e.book_id && e.entry_date && (!lastEntry.has(e.book_id) || e.entry_date > lastEntry.get(e.book_id))) lastEntry.set(e.book_id, e.entry_date);
  });
  const doneItems = books.filter(b => b.status === 'complete')
    .map(b => ({date:lastEntry.get(b.id) || latest, n:1}))
    .sort((a,b) => a.date.localeCompare(b.date));
  add('books',
    [[1,'ختمة أولى','📚'],[3,'ثلاثة كتب','📚'],[5,'خمسة كتب','📚'],[10,'عشرة كتب','📚']],
    st.booksRead,
    pfCumulative(doneItems, [1,3,5,10]),
    (c,t) => `${Math.min(c,t)}/${t} كتب`);

  return defs;
}
